[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crisislens"
version = "0.1.0"
description = "Multimodal (text + image) triage of disaster social media posts"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter", "seaborn"]
track = ["wandb"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
